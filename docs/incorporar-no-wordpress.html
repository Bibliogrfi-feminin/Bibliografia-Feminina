<!--
  Bibliografia Processual Feminina — incorporação na página do WordPress (USP)

  ===================================================================
  PASSO 1 — deixar a página em branco (sem menu, cabeçalho e rodapé)
  ===================================================================

  CAMINHO A — Elementor Canvas (preferível)
    1. Abra a página com "Editar com Elementor".
    2. No canto INFERIOR ESQUERDO do painel, clique na engrenagem (⚙)
       — é "Configurações da página", não confundir com o menu ☰ do topo.
    3. Aba "Geral" > campo "Modelo de página" (ou "Page Layout").
    4. Escolha "Elementor Tela em Branco" / "Elementor Canvas".
       - "Elementor Canvas"    = sem cabeçalho, menu e rodapé  <-- use este
       - "Elementor Full Width" = largura total, MAS mantém o menu do tema
       - "Padrão"               = o do tema, com menu e barra lateral
    5. Atualize e recarregue a página pública.

    Como conferir se pegou: veja o código-fonte da página publicada. A tag
    <body> deve conter "elementor-template-canvas". Se ainda aparecer
    "page-template-default", o Canvas não foi aplicado.

  CAMINHO B — editor clássico
    Se a página não estiver no Elementor: na barra lateral direita do
    editor, painel "Atributos da página" > "Modelo", escolha uma opção de
    largura total / sem barra lateral que o tema ofereça.

  CAMINHO C — o Canvas não aparece na lista
    Acontece em multisite quando o administrador da rede restringe os
    modelos. Nesse caso NÃO é preciso mudar o modelo: descomente o bloco
    <style> logo abaixo do iframe, que esconde cabeçalho, menu, barra
    lateral e rodapé apenas nesta página, usando os seletores do tema
    USP_id (#masthead, #navbar, #colophon, #secondary).

  ===================================================================
  PASSO 2 — colar este código
  ===================================================================
    Adicione um widget "HTML" (Elementor) ou um bloco "HTML personalizado"
    (editor padrão) e cole TUDO o que está abaixo. Depois publique.

  O que este código faz além de mostrar a página:
  - Ajusta a altura do iframe conforme o conteúdo, evitando barra de
    rolagem dupla.
  - Espelha a rota interna no endereço do WordPress, de modo que
    .../pagina/#/consulta/<id> abre direto aquela ficha e o botão voltar
    do navegador funciona.
-->

<div id="bpf-container" style="width:100%;">
  <noscript>
    <p style="text-align:center;padding:2rem;">
      Este conteúdo precisa de JavaScript.
      <a href="https://bibliografia-feminina-mu.vercel.app" target="_blank" rel="noopener">
        Abrir o sistema em nova aba
      </a>.
    </p>
  </noscript>

  <iframe
    id="bpf-frame"
    title="Bibliografia Processual Feminina"
    src="https://bibliografia-feminina-mu.vercel.app"
    loading="lazy"
    style="width:100%;height:900px;border:0;display:block;overflow:hidden;"
    scrolling="no"
  ></iframe>
</div>

<!--
  PLANO B (caminho C acima): só use se o "Elementor Canvas" não estiver
  disponível. Remova os marcadores de comentário desta linha e da linha
  final do bloco para ativar.

  Os seletores são os do tema USP_id: #masthead (cabeçalho), #navbar
  (menu), #colophon (rodapé), #secondary / .sidebar-container (barra
  lateral) e .entry-header (título repetido da página).

<style>
  #masthead,
  #navbar,
  #colophon,
  #secondary,
  .sidebar-container,
  .entry-header,
  .entry-meta {
    display: none !important;
  }

  /* o tema limita a largura e abre espaço para a barra lateral */
  body.sidebar #main,
  #page, #main, #primary, #content, .entry-content {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
    float: none !important;
  }

  body { background: #fff !important; }
</style>
-->

<script>
(function () {
  var ORIGEM_APP = "https://bibliografia-feminina-mu.vercel.app";
  var frame = document.getElementById("bpf-frame");
  if (!frame) return;

  // ------------------------------------------------------------------
  // 1. rota inicial: .../pagina/#/consulta/123 abre direto naquela ficha
  // ------------------------------------------------------------------
  function rotaDoHash() {
    var h = window.location.hash || "";
    if (h.indexOf("#/") !== 0) return null;
    var rota = h.slice(1);
    // só caminhos internos: barra o //evil.com
    return rota.indexOf("/") === 0 && rota.indexOf("//") !== 0 ? rota : null;
  }

  var inicial = rotaDoHash();
  if (inicial) frame.src = ORIGEM_APP + inicial;

  // ------------------------------------------------------------------
  // 2. mensagens vindas do app
  // ------------------------------------------------------------------
  var ignorarProximaRota = false;

  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGEM_APP) return;
    var d = e.data;
    if (!d || typeof d !== "object") return;

    if (d.tipo === "bpf:altura") {
      var altura = parseInt(d.altura, 10);
      // teto evita que um erro de medição estoure a página
      if (altura > 200 && altura < 30000) frame.style.height = altura + "px";
      return;
    }

    if (d.tipo === "bpf:rota" && typeof d.rota === "string") {
      // replaceState: não polui o histórico a cada clique interno
      if (!ignorarProximaRota) {
        try {
          history.replaceState(null, "", window.location.pathname + window.location.search + "#" + d.rota);
        } catch (err) { /* navegador antigo */ }
      }
      ignorarProximaRota = false;
    }
  });

  // ------------------------------------------------------------------
  // 3. botão voltar do navegador: manda o app acompanhar
  // ------------------------------------------------------------------
  window.addEventListener("hashchange", function () {
    var rota = rotaDoHash();
    if (!rota || !frame.contentWindow) return;
    ignorarProximaRota = true;
    frame.contentWindow.postMessage({ tipo: "bpf:ir", rota: rota }, ORIGEM_APP);
  });
})();
</script>
